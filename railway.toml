[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'if [ -f scripts/railway-start.sh ]; then exec sh scripts/railway-start.sh; else exec sh apps/api/scripts/railway-start.sh; fi'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
